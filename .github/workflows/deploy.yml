name: Build and Push to ECR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

            - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t wishifai .
          if aws ecr describe-images --repository-name wishifai --image-ids imageTag=$IMAGE_TAG --region eu-west-1 >/dev/null 2>&1; then
            echo "Image already exists. Skipping push."
          else
            docker tag wishifai:latest 244530008913.dkr.ecr.eu-west-1.amazonaws.com/wishifai:$IMAGE_TAG
            docker push 244530008913.dkr.ecr.eu-west-1.amazonaws.com/wishifai:$IMAGE_TAG
          fi